<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #050004;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: sans-serif;
        color: white;
        -webkit-app-region: drag;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        position: relative;
        overflow: hidden;
      }

      /* Title bar buttons */
      .titlebar {
        position: fixed;
        top: 0;
        right: 0;
        display: flex;
        -webkit-app-region: no-drag;
        height: 46px;
        padding: 4px;
      }
      .titlebar button {
        outline: none;
        border: none;
        background: transparent;
        aspect-ratio: 1 / 1;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 0.375rem;
        height: 100%;
        transition-property:
          color, background-color, border-color, text-decoration-color, fill,
          stroke;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 300ms;
        color: oklch(0.708 0 0);
      }
      .titlebar button:hover {
        color: oklch(0.985 0 0);
        background: oklch(0.2103 0.0059 285.89);
      }
      #btn-close:hover {
        color: white;
        background: oklch(0.704 0.191 22.216);
      }

      /* Your loader animation */
      .loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      .loader.fade-out {
        opacity: 0;
      }

      .loader img {
        width: 7vw;
        aspect-ratio: 1 / 1;
        animation: logo-scale 1.5s ease-out;
      }

      .message {
        opacity: 0;
        transition: opacity 0.3s ease;
        text-align: center;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
        margin-top: 8px;
      }
      .message.show {
        opacity: 1;
      }

      .message {
        opacity: 0;
        transform: translateY(10%);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
        text-align: center;
        font-size: 1.2vw;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.8);
        margin-top: 1.7vw;
        position: relative;
        z-index: 1;
      }
      .message.show {
        opacity: 1;
        transform: translateY(0);
      }

      .message p:first-child {
        font-size: 1.9vw;
        font-weight: 600;
      }

      .message p:last-child {
        margin-top: 0.29vw;
        color: rgba(255, 255, 255, 0.6);
      }

      .fade-gradient {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 80%;
        background: linear-gradient(180deg, transparent 0%, #2c033f 100%);
        pointer-events: none;
        animation: fade-gradient 1.5s ease-out;
      }

      .fade-gradient.fade-out {
        animation: none;
        opacity: 0;
      }

      @keyframes fade-gradient {
        from {
          opacity: 0;
          transform: translateY(15%);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes logo-scale {
        0% {
          transform: scale(0.85);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <button onclick="window.aniverseDesktop.minimize()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          color="currentColor"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19.002 12L5.00001 12" />
        </svg>
      </button>
      <button onclick="window.aniverseDesktop.maximize()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="14"
          height="14"
          color="currentColor"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            d="M2.5 12C2.5 7.52166 2.5 5.28249 3.89124 3.89124C5.28249 2.5 7.52166 2.5 12 2.5C16.4783 2.5 18.7175 2.5 20.1088 3.89124C21.5 5.28249 21.5 7.52166 21.5 12C21.5 16.4783 21.5 18.7175 20.1088 20.1088C18.7175 21.5 16.4783 21.5 12 21.5C7.52166 21.5 5.28249 21.5 3.89124 20.1088C2.5 18.7175 2.5 16.4783 2.5 12Z"
          />
        </svg>
      </button>
      <button id="btn-close" onclick="window.aniverseDesktop.close()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          color="currentColor"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085" />
        </svg>
      </button>
    </div>

    <div class="loader" id="loader">
      <img
        src="assets/icons/transparant/512.png"
        alt="Aniverse"
        draggable="false"
      />

      <div class="message" id="message">
        <p>Taking longer than expected.</p>
        <p>Please check your internet connection.</p>
      </div>
    </div>

    <div class="fade-gradient" id="fade-gradient"></div>

    <script>
      const MIN_ANIMATION_MS = 1500;
      const startTime = Date.now();

      // Show message after 5 seconds if still loading
      setTimeout(() => {
        const loader = document.getElementById("loader");
        if (!loader.classList.contains("fade-out")) {
          document.getElementById("message").classList.add("show");
        }
      }, 9000);

      // Main process signals app is ready
      window.electronAPI.onAppReady(() => {
        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, MIN_ANIMATION_MS - elapsed);

        setTimeout(() => {
          document.getElementById("loader").classList.add("fade-out");
          document.getElementById("fade-gradient").classList.add("fade-out");
          // Give fade-out time to finish before switching
          setTimeout(() => window.electronAPI.sendLoaderDone(), 400);
        }, remaining);
      });
    </script>
  </body>
</html>
